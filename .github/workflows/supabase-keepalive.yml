name: Supabase keep-alive

on:
  schedule:
    # Daily at 12:00 UTC. Free-tier projects pause after 7 days of
    # inactivity; running daily leaves plenty of buffer for runs that
    # GitHub silently skips under load.
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Open a real Postgres connection so Supabase registers activity
        # The Data API (PostgREST/RPC) no longer resets Supabase's auto-pause
        # timer — both a REST read and an RPC call were tried and the project
        # still paused. A direct connection over the Supavisor pooler is a
        # genuine DB client session and is the activity that actually counts.
        env:
          # Pooler connection string (Dashboard → Connect → Session/Transaction
          # pooler). Must be the pooler host, not the direct connection: GitHub
          # runners are IPv4-only and the direct host is IPv6.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -At -c "select now();"
          echo "Opened a Postgres connection and queried successfully."
